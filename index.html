 act=[{k:'in',t:`Dev wants to borrow ${c.t}`,s:'Pending',b:c.t,who:'Dev',w:'Maple St',d:'0.4 mi away'},{k:'th',t:`Maya shared a thought on your copy of ${b.t}`,s:'New',tid:1,fresh:1},{k:'rp',t:`Rosa replied to your thought on ${a.t}`,s:'New',tid:6,fresh:1}];
 loans=[{t:'Station Eleven',a:'Emily St. John Mandel',c:'#6A4A5A',from:'Rosa',days:9,total:14}];
 reading=[{t:a.t,c:a.c},{t:b.t,c:b.c},{t:'Station Eleven',c:'#6A4A5A',from:'Rosa'}];
 fakeLent={[b.id]:{who:'Maya',due:6}};unread=3;seen=null;tid=10;rebuild();notify()}
function rebuild(){const U=DB.users||{},R=Object.values(DB.requests||{}),mine=(U[me.id]||{}).books||{};
 lib=Object.values(mine).sort((x,y)=>x.id-y.id).map(b=>{const r=R.find(r=>r.bookId===b.id&&r.status==='approved'),f=fakeLent[b.id];return {...b,lent:r?r.fromName:f&&f.who,due:r?Math.max(1,14-Math.floor((Date.now()-(r.appTs||Date.now()))/864e5)):f&&f.due,rid:r&&r.id}});
 const held=new Set(R.filter(r=>r.status==='approved').map(r=>r.bookId)),real=[];
 Object.entries(U).forEach(([id,u])=>{if(id===me.id)return;Object.values(u.books||{}).forEach(b=>{if(b.on&&!held.has(b.id))real.push({id:b.id,t:b.t,a:b.a,c:b.c,o:u.name,w:u.unit||'Nearby',d:'In your building',b:1,real:1,uid:id})})});
 near=[...seedNear,...real]}
function notify(){const R=Object.values(DB.requests||{}),cur={};R.forEach(r=>{if(r.to===me.id||r.from===me.id)cur[r.id]=r.status});
 if(seen)R.forEach(r=>{if(r.to===me.id&&!(r.id in seen)){unread++;toast(`${r.fromName} wants to borrow ${r.t}`)}else if(r.from===me.id&&seen[r.id]&&seen[r.id]!==r.status&&r.status!=='returned'){unread++;toast(r.status==='approved'?`${r.toName} approved ${r.t}. Check Activity`:`${r.toName} declined ${r.t}`)}});seen=cur}
function realReq(b){const id='r'+Date.now()+Math.floor(Math.random()*99);dbSet('requests/'+id,{id,bookId:b.id,t:b.t,a:b.a,c:b.c,from:me.id,fromName:me.name,to:b.uid,toName:b.o,status:'pending',ts:Date.now()});if(seen)seen[id]='pending';asec='share';go('a');toast('Request sent to '+b.o)}
function apR(id,ok){const r=DB.requests[id];if(!r)return;dbSet('requests/'+id,{...r,status:ok?'approved':'declined',appTs:Date.now()});rebuild();draw();toast(ok?`${r.fromName} has been told. ${r.t} is marked as lent`:'Request declined')}
function retR(id){const r=DB.requests[id];if(!r)return;dbSet('requests/'+id,{...r,status:'returned'});rebuild();draw();toast('Marked as returned. It’s back on your shelf')}
function onboard(){return `<div style="min-height:100%;display:flex;flex-direction:column;justify-content:center"><h1 style="font-size:38px;text-align:center">ShelfShare</h1><p class="tag-l" style="font-size:15px;text-align:center;margin-bottom:18px">One Shared Shelf</p>
 <div class="pair big" style="justify-content:center;margin-bottom:18px">${POOL.slice(0,3).map(b=>cv(b)).join('')}</div>
 <label class="lbl" for="un" style="margin-top:0">What should neighbors call you?</label><input id="un" class="ri" style="width:100%;border-radius:14px;padding:12px" maxlength="20" placeholder="e.g. Alex" autocomplete="off" onkeydown="if(event.key==='Enter')signUp()">
 <label class="lbl" for="ut">Where are you? <span style="font-weight:400;color:var(--mut)">(optional)</span></label><input id="ut" class="ri" style="width:100%;border-radius:14px;padding:12px" maxlength="20" placeholder="e.g. Unit 3B or Midtown" autocomplete="off" onkeydown="if(event.key==='Enter')signUp()">
 <button class="btn acc" onclick="signUp()">Create account</button>
 <p style="color:var(--mut);font-size:13px;margin-top:12px;text-align:center">We’ll put three classics on your shelf so neighbors have something to borrow right away. Already signed up? Enter the same name to log back in.</p>
 <p class="tag" style="margin:10px auto 0;text-align:center">${LIVE?'Live: everyone on this site shares one neighborhood':'Local mode: accounts live in this browser only'}</p></div>`}
async function signUp(){await sync(true);if(!DBok){toast('Can’t reach the server. Check your connection.');return}
 const cl=s=>s.replace(/[^\p{L}\p{N} .'’-]/gu,'').trim().slice(0,20),name=cl($('un').value),unit=cl($('ut').value);if(!name){toast('Enter a name first');return}
 const id=name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'')||'neighbor',U=DB.users||{};let fresh=false;
 if(U[id])me={id,name:U[id].name,unit:U[id].unit};else{fresh=true;
  const held={};Object.values(U).forEach(u=>Object.values(u.books||{}).forEach(b=>held[b.t]=(held[b.t]||0)+1));
  const pick=POOL.map((b,i)=>[b,i]).sort((x,y)=>(held[x[0].t]||0)-(held[y[0].t]||0)||x[1]-y[1]).slice(0,3).map(x=>x[0]),t0=Date.now()*10,books={};
  pick.forEach((b,i)=>books['b'+(t0+i)]={id:t0+i,t:b.t,a:b.a,c:b.c,on:1});
  await dbSet('users/'+id,{name,unit,joined:Date.now(),books});me={id,name,unit}}
 ls.set('ss_me',JSON.stringify(me));tab='d';rebuild();seedWorld();draw();toast(fresh?`Welcome, ${name}. Three books are now on your shelf`:`Welcome back, ${name}`)}
function signOut(auto){ls.del('ss_me');me=null;seen=null;tab='d';asec='share';draw();if(auto)toast('Account not found. Please sign up again.')}
async function sync(force){if(pend)return;let d;try{d=scrub(await load());DBok=true}catch(e){return}const j=JSON.stringify(d);if(j===last&&!force)return;last=j;DB=d;if(!me)return;if(!(DB.users||{})[me.id]){signOut(1);return}
 rebuild();notify();const ae=document.activeElement;if(['d','a','p'].includes(tab)&&!document.querySelector('.scrim,.scrim2')&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))draw();else tabs()}
function seeT(id){go('f');document.getElementById('r'+id).scrollIntoView({block:'center'})}
function tabs(){$('tabs').innerHTML=[['d','Discover'],['f','Feed'],['s','Add'],['a','Activity'],['p','Me']].map(([k,n])=>k==='s'?`<button class="scan" onclick="go('s')"><span>${ic('s')}</span>${n}</button>`:`<button class="${tab===k||(tab==='detail'&&k==='d')||(tab==='post'&&k==='f')?'on':''}" onclick="go('${k}')">${ic(k)}${n}${k==='a'&&unread?`<b class="dot">${unread}</b>`:''}</button>`).join('')}
function draw(){const s=$('screen');s.className='';if(!me){s.innerHTML=onboard();$('tabs').innerHTML='';return}s.innerHTML={d:discover,detail,f:feed,post:compose,s:scan,p:profile,a:activity}[tab]();tabs()}
setInterval(()=>sync(),2500);addEventListener('storage',()=>sync());
(async()=>{$('screen').innerHTML='<p style="color:var(--mut);margin-top:40%;text-align:center">Loading…</p>';await sync(true);let sv=null;try{sv=JSON.parse(ls.get('ss_me')||'null')}catch(e){}
 if(sv&&(DB.users||{})[sv.id]){me=sv;seedWorld()}draw()})();
