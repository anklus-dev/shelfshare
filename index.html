<!DOCTYPE html>

<title>ShelfShare – One Shared Shelf</title>

<style>

:root[data-theme="dark"]{--bg:#1E1510;--card:#2A1E17;--ink:#F1E6D8;--mut:#B09B89;--line:#40302A;--pinebg:#3D2C20;--shell:#120C08;--pine:#DDAA70;--hi:#4A3527;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.4 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--shell);display:flex;align-items:center;justify-content:center}

.reps{margin-top:8px}

function stats(id){const u=(DB.users||{})[id]||{};return {read:Object.keys(u.read||{}).length,lent:Object.values(DB.requests||{}).filter(r=>r.to===id&&(r.status==='approved'||r.status==='returned')).length,streak:streakOf(id).cur,pages:streakOf(id).pages}}

/* ---------- activity ---------- */
function tItems(){const out=[];thoughtsArr().forEach(t=>{
 if(t.lender===me.id&&t.uid!==me.id)out.push({key:'t:'+t.id,tid:t.id,ts:t.ts,kind:'th',text:`${t.who} shared a thought on your copy of ${t.t}`,prev:t.spoil?'':t.txt});
 if(t.uid===me.id)reps(t).forEach(r=>{if(r.uid!==me.id)out.push({key:'p:'+t.id+':'+r.id,tid:t.id,ts:r.ts,kind:'rp',text:`${r.who} replied to your thought on ${t.t}`,prev:r.txt})})});
 out.sort((a,b)=>b.ts-a.ts);out.forEach(i=>i.fresh=!(tseen&&tseen.has(i.key)));return out}
function saveTSeen(){ls.set('ss_ts_'+me.id,JSON.stringify([...tseen].slice(-300)))}
function activity(){
 const R=Object.values(DB.requests||{}).sort((a,b)=>b.ts-a.ts),U=DB.users||{};
 const pend=R.filter(r=>r.to===me.id&&r.status==='pending'),outs=R.filter(r=>r.from===me.id&&r.status!=='returned').slice(0,8),loans=R.filter(r=>r.from===me.id&&r.status==='approved'),lent=lib.filter(b=>b.lent);
 const items=tItems(),nNew=items.filter(i=>i.fresh).length;
 const head=`<div class="top"><h1>Activity</h1></div><div class="seg"><button class="${asec==='share'?'on':''}" onclick="asec='share';draw()">Sharing${pend.length?`<b class="nb">${pend.length}</b>`:''}</button><button class="${asec==='th'?'on':''}" onclick="asec='th';draw()">Thoughtstream${nNew&&asec!=='th'?`<b class="nb">${nNew}</b>`:''}</button></div>`;

  if(tseen){items.forEach(i=>tseen.add(i.key));saveTSeen()}return head+h}
 const rq=pend.map(r=>{const su=U[r.from]||{};return `<div class="reqc" id="rq-${esc(r.id)}"><div class="ph"><div class="pa" style="--c:${esc(r.c||'#6B4226')}">${esc((r.fromName||'?')[0])}</div><div><b>${esc(r.fromName)} wants to borrow</b><small>${esc(su.unit||(su.loc&&su.loc.city)||'Nearby')} · ${esc(fmtD(dist(myLoc(),su.loc)))}</small></div><span class="tag" style="background:var(--acc);color:var(--accink)">${r.offer?'Swap offer':'New request'}</span></div><div class="item">${cv(r)}<div><b class="serif" style="font-size:18px">${esc(r.t)}</b><small>${esc(r.a||'')}</small>${r.offer?`<small>Offers ${esc(r.offer.t)} in exchange</small>`:'<small>Usually lent for two weeks</small>'}</div>${bookIco()}</div><div class="two"><button class="btn acc" onclick="apR('${r.id}',1)">Approve</button><button class="btn ghost" onclick="apR('${r.id}',0)">Decline</button></div></div>`}).join('');
 const ot=outs.map(r=>`<div class="card"><div class="item"><div style="flex:1"><b style="font-weight:500">${esc(r.swapOf?`Swap: you’re borrowing ${r.t} from ${r.toName}`:r.offer?`Swap proposed: ${r.offer.t} for ${r.t}`:`You asked ${r.toName} to borrow ${r.t}`)}</b></div><span class="st ${r.status==='approved'?'ok':''}">${STL[r.status]||esc(r.status)}</span></div></div>`).join('');
 const bo=loans.map(r=>{const d=daysLeft(r);return `<div class="card"><div class="item">${cv(r)}<div><b>${esc(r.t)}</b><small>From ${esc(r.toName)}</small><div class="bar2 ${d<=3?'lo':''}"><i style="width:${Math.min(100,d/(14+(r.ext||0))*100)}%"></i></div><small><b>${dl(d)} left</b>${d<=3?' · due soon':''}</small></div></div><div class="two" style="margin-top:8px"><button class="chip" onclick="extendR('${r.id}')">Extend by a week</button><button class="chip ${isRead(r.t)?'on':''}" onclick="readL('${r.id}')">${isRead(r.t)?'Read ✓':'Finished reading'}</button></div></div>`}).join('');
 const lo=lent.map(b=>`<div class="card item">${cv(b)}<div><b>${esc(b.t)}</b><small>With ${esc(b.lent)}</small><span class="tag">Returns in ${dl(b.due||7)}</span>${b.rid?`<button class="chip" style="margin-left:6px" onclick="retR('${b.rid}')">Mark returned</button>`:''}</div></div>`).join('');

/* ---------- add a book: live barcode scanner + book lookup ---------- */
const SWATCH=['#8C4A3C','#5B4B3A','#7A8541','#6A4A5A','#B07A2A','#4E6B3E','#7A4B2A','#8A5A44'];
const swatch=t=>SWATCH[[...String(t)].reduce((x,c)=>(x*31+c.charCodeAt(0))>>>0,7)%SWATCH.length];
const COVER_OK=/^(https:\/\/(covers\.openlibrary\.org|archive\.org|books\.google\.com|books\.googleusercontent\.com|[a-z0-9-]+\.us\.archive\.org)\/[^\s"'<>]*|data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,40000})$/;

/* ISBN helpers */
const isbn13ok=s=>/^97[89]\d{10}$/.test(s)&&(10-[...s.slice(0,12)].reduce((a,c,i)=>a+(+c)*(i%2?3:1),0)%10)%10===+s[12];

/* ---------- camera ---------- */
const cam={stream:null,track:null,run:0,busy:0,last:'',hits:0,torch:0,zoom:0,msgAt:0,wasm:0};
const camMsg=t=>{const e=$('vmsg');if(e)e.textContent=t};
function camStop(){cam.run++;cam.busy=0;cam.last='';cam.hits=0;
 if(cam.stream)cam.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});
 cam.stream=cam.track=null;cam.torch=0;const v=$('cam');if(v)try{v.srcObject=null}catch(e){}}
function camTools(){const e=$('vt');if(!e||!cam.track)return;let c={};try{c=cam.track.getCapabilities?cam.track.getCapabilities():{}}catch(x){}
 e.innerHTML=(c.torch?`<button class="chip ${cam.torch?'on':''}" onclick="camTorch()">${cam.torch?'Light on':'Light'}</button>`:'')+(c.zoom&&c.zoom.max>1.5?`<button class="chip ${cam.zoom?'on':''}" onclick="camZoom()">${cam.zoom?'Zoom 2×':'Zoom'}</button>`:'')}
async function camTorch(){cam.torch=cam.torch?0:1;try{await cam.track.applyConstraints({advanced:[{torch:!!cam.torch}]})}catch(e){cam.torch=0;toast('This camera has no light')}camTools()}
async function camZoom(){cam.zoom=cam.zoom?0:1;try{const c=cam.track.getCapabilities().zoom;await cam.track.applyConstraints({advanced:[{zoom:cam.zoom?Math.min(c.max,Math.max(c.min||1,2)):(c.min||1)}]})}catch(e){cam.zoom=0}camTools()}
function camFail(kind){const m={denied:'Camera access is blocked. Allow it in your browser settings, or use a photo or the ISBN box below.',nocam:'No camera found on this device. Use a photo or type the ISBN below.',busy:'The camera is in use by another app. Close it and try again, or use the options below.',insecure:'Camera needs a secure (https) page. Use a photo or type the ISBN below.',other:'Couldn’t start the camera. Use a photo or type the ISBN below.'}[kind]||'';
 const w=$('vw');if(w)w.classList.add('off');camMsg(m);const e=$('vt');if(e&&kind!=='nocam'&&kind!=='insecure')e.innerHTML='<button class="chip" onclick="camRetry()">Try camera again</button>'}
function camRetry(){const w=$('vw');if(w)w.classList.remove('off');const e=$('vt');if(e)e.innerHTML='';camStop();camStart()}
async function camStart(){const v=$('cam');if(!v||scanSt!==0||tab!=='s')return;
 if(cam.stream){if(v.srcObject!==cam.stream){v.srcObject=cam.stream;try{await v.play()}catch(e){}}camTools();return}
 if(cam.busy)return;
 const md=navigator.mediaDevices;if(!md||!md.getUserMedia){camFail(window.isSecureContext===false?'insecure':'nocam');return}
 cam.busy=1;const my=++cam.run;camMsg('Starting camera…');let s=null,err=null;
 for(const c of [{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:{facingMode:'environment'},audio:false},{video:true,audio:false}]){
  try{s=await md.getUserMedia(c);break}catch(e){err=e;if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))break}}
 if(my!==cam.run||tab!=='s'||scanSt!==0){if(s)s.getTracks().forEach(t=>t.stop());return}
 cam.busy=0;
 if(!s){const n=err&&err.name;camFail(n==='NotAllowedError'||n==='SecurityError'?'denied':n==='NotFoundError'||n==='DevicesNotFoundError'?'nocam':n==='NotReadableError'||n==='TrackStartError'?'busy':'other');return}
 cam.stream=s;cam.track=s.getVideoTracks()[0];const vv=$('cam');if(!vv){camStop();return}
 vv.srcObject=s;try{await vv.play()}catch(e){}
 try{const cp=cam.track.getCapabilities?cam.track.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}

/* ---------- decoder: native BarcodeDetector where it works, bundled ZXing (WebAssembly) everywhere else ---------- */
const BC_FORMATS=['ean_13','upc_a','ean_8','upc_e'];
let detP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
function getDet(){if(detP)return detP;
 detP=(async()=>{
  if(!cam.wasm&&'BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();if(sup.includes('ean_13'))return {d:new BarcodeDetector({formats:BC_FORMATS.filter(f=>sup.includes(f))}),n:'native'}}catch(e){}}
  if(!window.BarcodeDetectionAPI)await loadScript(new URL('vendor/barcode-detector.js',location.href).href);
  const A=window.BarcodeDetectionAPI,wasm=new URL('vendor/zxing_reader.wasm',location.href).href;
  A.setZXingModuleOverrides({locateFile:(p,pre)=>/\.wasm$/.test(p)?wasm:pre+p});
  return {d:new A.BarcodeDetector({formats:BC_FORMATS}),n:'wasm'}})();
 detP.catch(()=>{detP=null});return detP}
function drawCrop(src,sx,sy,sw,sh,cvs,max){const k=Math.min(1,max/sw);cvs.width=Math.round(sw*k);cvs.height=Math.round(sh*k);
 const x=cvs.getContext('2d',{willReadFrequently:true});x.drawImage(src,sx,sy,sw,sh,0,0,cvs.width,cvs.height);return cvs}
async function detectBook(dd,cvs){let r;try{r=await dd.d.detect(cvs)}catch(e){e.fatal=true;throw e}
 let book=null,other=false;for(const b of r||[]){const n=normIsbn(b.rawValue);if(n){book=n;break}if(/^\d{8,13}$/.test(b.rawValue||''))other=true}
 return {book,other}}
async function camLoop(my){let dd;
 try{dd=await getDet()}catch(e){camMsg('The scanner couldn’t load. Use a photo or type the ISBN below.');return}
 const cvs=document.createElement('canvas');let fails=0;
 while(my===cam.run){
  const v=$('cam');
  if(v&&v.readyState>=2&&v.videoWidth&&!document.hidden){
   // scan exactly what the person sees (the video is shown with object-fit: cover)
   const W=v.videoWidth,H=v.videoHeight,eW=v.clientWidth||W,eH=v.clientHeight||H,k=Math.max(eW/W,eH/H),sw=Math.min(W,eW/k),sh=Math.min(H,eH/k);
   try{
    drawCrop(v,(W-sw)/2,(H-sh)/2,sw,sh,cvs,dd.n==='native'?1600:1280);
    const r=await detectBook(dd,cvs);fails=0;if(my!==cam.run)return;
    if(r.book){if(cam.last===r.book)cam.hits++;else{cam.last=r.book;cam.hits=1}if(cam.hits>=2){gotIsbn(r.book,'camera');return}}
    else{cam.hits=0;cam.last='';if(r.other&&Date.now()-cam.msgAt>2500){cam.msgAt=Date.now();camMsg('That isn’t a book barcode. Look for the one starting with 978.');setTimeout(()=>{if(my===cam.run)camMsg('Point at the barcode on the back cover')},2600)}}
   }catch(e){
    if(dd.n==='native'&&++fails>=3){cam.wasm=1;detP=null;try{dd=await getDet()}catch(x){camMsg('The scanner couldn’t load. Use a photo or type the ISBN below.');return}fails=0}
    else if(dd.n==='wasm'&&++fails>=20){camMsg('The scanner hit a problem. Use a photo or type the ISBN below.');return}}}
  await sleep(dd.n==='native'?80:120)}}

/* photo of a barcode (works when the live camera can't: blocked permission, in-app browsers, desktop) */
async function scanPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;camMsg('Reading photo…');toast('Reading photo…');

 let bmp;try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){try{bmp=await createImageBitmap(f)}catch(x){toast('Couldn’t open that photo');return}}
 const cvs=document.createElement('canvas');let found=null;
 for(const max of [1600,1000,2400,700]){try{drawCrop(bmp,0,0,bmp.width,bmp.height,cvs,max);const r=await detectBook(dd,cvs);if(r.book){found=r.book;break}}catch(e){}}

/* ---------- book lookup: Open Library first, Google Books as backup ---------- */
function fetchT(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
function jsonp(url,ms){return new Promise((res,rej)=>{const cb='__ssjp'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=0;
 const end=f=>{if(done)return;done=1;clearTimeout(t);delete window[cb];s.remove();f()};const t=setTimeout(()=>end(()=>rej(new Error('timeout'))),ms);
 window[cb]=d=>end(()=>res(d));s.onerror=()=>end(()=>rej(new Error('jsonp')));s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s)})}
const isbn10of=i=>{if(!/^978\d{10}$/.test(i))return '';const b=i.slice(3,12);let t=0;[...b].forEach((c,k)=>t+=(+c)*(10-k));const r=(11-t%11)%11;return b+(r===10?'X':r)};
const olCover=id=>id?`https://covers.openlibrary.org/b/id/${id}-M.jpg`:'';
async function olApi(url){try{const r=await fetchT(url,7000);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){return await jsonp(url,7000)}}

 const d=j&&(j['ISBN:'+i]||(k10&&j['ISBN:'+k10]));if(!d||!d.title)return null;
 return {t:clean(d.title,60),a:clean((d.authors||[]).slice(0,2).map(x=>x.name).join(', '),40),cu:d.cover&&(d.cover.medium||d.cover.large||d.cover.small)||'',src:'Open Library'}}
async function olSearch(i){const j=await olApi(`https://openlibrary.org/search.json?q=isbn:${i}&fields=title,author_name,cover_i&limit=3`),d=j&&j.docs&&(j.docs.find(x=>x.title&&x.cover_i)||j.docs.find(x=>x.title));
 if(!d)return null;return {t:clean(d.title,60),a:clean((d.author_name||[]).slice(0,2).join(', '),40),cu:olCover(d.cover_i),src:'Open Library'}}
async function gbTry(q,i,k10){const r=await fetchT(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=5&country=US`,7000);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
 const v=(j.items||[]).map(x=>x.volumeInfo).find(v=>v&&v.title&&(v.industryIdentifiers||[]).some(x=>x.identifier===i||x.identifier===k10));if(!v)return null;
 const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)||'';
 return {t:clean(v.title,60),a:clean((v.authors||[]).slice(0,2).join(', '),40),cu:im.replace(/^http:/,'https:').replace('&edge=curl',''),src:'Google Books'}}
async function gbLookup(i){const k10=isbn10of(i);let e=null;
 for(const q of ['isbn:'+i,k10?'isbn:'+k10:'',i]){if(!q)continue;try{const r=await gbTry(q,i,k10);if(r)return r}catch(x){e=x}}
 if(e)throw e;return null}
async function lookupIsbn(i){const names=['Open Library','Open Library search','Google Books'],rs=await Promise.allSettled([olData(i),olSearch(i),gbLookup(i)]);
 const diag=rs.map((r,k)=>names[k]+': '+(r.status==='rejected'?'no answer':r.value?'found':'no record')).join(' · ');
 const hits=rs.filter(r=>r.status==='fulfilled'&&r.value).map(r=>r.value);
 if(!hits.length)return {diag,err:rs.some(r=>r.status==='rejected')};
 const b={...hits[0]};for(const h of hits){if(!b.cu&&h.cu)b.cu=h.cu;if(!b.a&&h.a)b.a=h.a}
 if(!b.cu)b.cu=`https://covers.openlibrary.org/b/isbn/${i}-M.jpg?default=false`;
 if(!COVER_OK.test(b.cu))b.cu='';b.diag=diag;return b}
let lkTok=0;
async function gotIsbn(i,how){camStop();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}

 if(r.t){newB={...r,i,c:swatch(r.t)};scanSt=2}else{newB={i,diag:r.diag};scanSt=r.err?6:4}draw()}

 return `<div class="top"><h1>Add a book</h1></div>
 <div class="view" id="vw"><video id="cam" playsinline muted autoplay></video><div class="bar"></div><p class="vmsg" id="vmsg">Starting camera…</p><div class="vtools" id="vt"></div></div>
 <div class="two" style="align-items:center"><input id="isbn" class="ri" inputmode="numeric" aria-label="ISBN" placeholder="Or type the ISBN (978…)" maxlength="17" autocomplete="off" onkeydown="if(event.key==='Enter')isbnGo()"><button class="chip on" onclick="isbnGo()">Look up</button></div>
 <label class="btn ghost" style="display:block;text-align:center;cursor:pointer">Take a photo of the barcode<input type="file" accept="image/*" capture="environment" hidden onchange="scanPhoto(this)"></label>
 <button class="btn ghost" onclick="scanSt=3;newB=null;draw()">Add by title instead</button>`}
function keepFields(){const o=newB||{};newB={...o,t:clean(($('mt')||{value:o.t||''}).value,60),a:clean(($('ma')||{value:o.a||''}).value,40)}}
async function photoToCover(file){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
 const W=180,H=270,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),k=Math.max(W/bmp.width,H/bmp.height),sw=W/k,sh=H/k;

let owlBusy=0;
function owlTake(id){return new Promise(res=>{
 const card=$('rq-'+id),ico=card&&card.querySelector('.bkico'),app=$('app');
 if(!card||!ico||!app||!ico.animate||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){res();return}
 owlBusy=1;card.classList.add('taking');card.querySelectorAll('button').forEach(b=>b.disabled=true);
 const ar=app.getBoundingClientRect(),ir=ico.getBoundingClientRect(),W=ar.width,ix=ir.left-ar.left+ir.width/2,iy=ir.top-ar.top+ir.height/2;
 const o=document.createElement('div');o.className='owl';o.innerHTML=OWL_SVG;o.style.left=(ix-60)+"px";o.style.top=(iy-62)+"px";app.appendChild(o);
 const T=2400,tr=(x,y,r,s)=>`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
 const a=o.animate([
  {transform:tr(W-ix+120,-170,10,.8),opacity:0,offset:0},
  {transform:tr(W-ix+40,-120,8,.85),opacity:1,offset:.06,easing:'cubic-bezier(.2,.75,.3,1)'},
  {transform:tr(0,0,0,1),opacity:1,offset:.44},
  {transform:tr(0,2,0,1),opacity:1,offset:.54,easing:'cubic-bezier(.55,0,.9,.6)'},
  {transform:tr(-(ix+220),-(iy+200),-14,.75),opacity:1,offset:1}],{duration:T,fill:'forwards'});
 o.classList.add('fly');
 setTimeout(()=>{o.classList.add('hover')},T*.34);
 setTimeout(()=>{const c=o.querySelector('.carry');if(c)c.setAttribute('opacity','1');ico.style.visibility='hidden';o.classList.remove('hover')},T*.47);
 const done=()=>{o.remove();card.classList.remove('taking');owlBusy=0;res()};
 a.onfinish=done;a.oncancel=done;setTimeout(()=>{if(o.isConnected)done()},T+600)})}

const cleanRef=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,12);
let refIn=(()=>{try{const c=cleanRef(new URLSearchParams(location.search).get('ref')||ls.get('ss_ref')||'');if(c)ls.set('ss_ref',c);return c}catch(e){return ''}})();
function genRef(name,id,U){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',pre=(String(name).normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase()+'READ').slice(0,4),taken=new Set(Object.values(U||{}).map(u=>u&&u.ref));
 for(let n=0;n<50;n++){let h=7;for(const c of id+'|'+n)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;let s='';for(let i=0;i<4;i++){s+=A[h%32];h=((h>>>5)^Math.imul(h,2654435761))>>>0}const code=pre+'-'+s;if(!taken.has(code))return code}
 return pre+'-'+Date.now().toString(36).slice(-4).toUpperCase()}
const refLink=c=>location.origin+location.pathname+'?ref='+encodeURIComponent(c);

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(x){return false}}}

 if(navigator.share){try{await navigator.share({title:'ShelfShare',text:txt,url:link});return}catch(e){if(e&&e.name==='AbortError')return}}

/* auto-created clubs around a new user's location (ids are deterministic, so neighbors share them) */
const CT=[
 ['readers','{c} Readers','Everyone reading in and around {c}.','city',0,0,'Welcome to {n}! Introduce yourself and tell us what you’re reading this week.'],
 ['coffee','Coffee & Chapters, {c}','Casual chat about what’s on your nightstand.','hood',0.6,0.4,'What’s one book you’d recommend to someone who only reads a few a year?'],
 ['swap','{c} Neighbors Book Swap','Arrange swaps and share pickup spots.','hood',-0.5,-0.8,'Post a book you’d love to swap and where you could meet. Requests are sent from the Discover tab.'],
 ['classics','{c} Classics Circle','Odysseys, Austens and other books everyone has heard of.','town',-1.8,0.9,'Which classic surprised you by being better (or worse) than you expected?'],
 ['scifi','Sci-Fi & Fantasy Corner, {c}','Spaceships, dragons and everything in between.','town',2.4,-1.7,'Best opening chapter you’ve ever read? Spoiler warnings, please.'],
 ['state','{s} Book Lovers','Readers across the state.','state',9,6,'Hello from across {s}! Which local library or bookstore deserves a shout-out?']];
function ensureClubs(){const loc=myLoc();if(!loc)return;
 const c=loc.city||'Your Area',s=loc.region||'Statewide',base=slug((loc.city||'local')+'-'+(loc.region||'')),u=(DB.users||{})[me.id]||{};
 const make=(id,name,desc,kind,lat,lon,first)=>{if(((DB.clubs||{})[id]))return;
  dbSet('clubs/'+id,{id,name,desc,kind,lat,lon,city:loc.city||'',region:loc.region||'',ts:Date.now(),auto:1});
  dbSet(`clubmsgs/${id}/m1`,{id:'m1',uid:'sys',who:'ShelfShare',txt:first,ts:Date.now()})};
 CT.forEach(([k,n,d,kind,dx,dy,first])=>{const name=n.replace('{c}',c).replace('{s}',s);
  make('auto-'+base+'-'+k,name,d.replace('{c}',c),kind,Math.round((loc.lat+dy/69)*1000)/1000,Math.round((loc.lon+dx/(69*Math.cos(rad(loc.lat))))*1000)/1000,first.replace('{n}',name).replace('{s}',s))});
 const unit=(u.unit||'').trim(),mine=['auto-'+base+'-readers'];
 if(unit&&slug(unit)){const id='bld-'+slug(unit)+'-'+base;make(id,unit+' Book Club','Neighbors of '+unit+'. Swap books and talk about what you’re reading.','building',loc.lat,loc.lon,`Welcome, neighbors of ${unit}! Say hi and share a book from your shelf.`);mine.unshift(id)}
 mine.forEach(id=>{if(!((((DB.clubs||{})[id]||{}).members||{})[me.id]))dbSet(`clubs/${id}/members/${me.id}`,1)})}

/* leaderboard */
function board(metric,range){const U=DB.users||{},ml=myLoc(),rg=RANGES.find(x=>x[0]===range);
 const rows=Object.entries(U).filter(([id,u])=>{if(id===me.id)return true;if(!ml||!u.loc)return false;
  if(rg[2]==null)return slug(u.loc.region)===slug(ml.region)&&(u.loc.cc||'')===(ml.cc||'');const d=dist(ml,u.loc);return d!=null&&d<=rg[2]})
  .map(([id,u])=>({id,name:u.name||id,place:u.unit||(u.loc&&u.loc.city)||'',score:stats(id)[metric]}));
 rows.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
 rows.forEach((r,i)=>{r.rank=i&&rows[i-1].score===r.score?rows[i-1].rank:i+1});return rows}
function leaderboard(){const rows=board(lbM,lbR),mineR=rows.find(r=>r.id===me.id),rg=RANGES.find(x=>x[0]===lbR),ml=myLoc();
 return `<div class="seg"><button class="${lbM==='read'?'on':''}" onclick="lbM='read';draw()">Read</button><button class="${lbM==='lent'?'on':''}" onclick="lbM='lent';draw()">Lent</button><button class="${lbM==='streak'?'on':''}" onclick="lbM='streak';draw()">Streak</button><button class="${lbM==='pages'?'on':''}" onclick="lbM='pages';draw()">Pages</button></div>
 <div class="row" style="margin-top:0">${RANGES.map(([k,n])=>`<button class="chip ${lbR===k?'on':''}" onclick="lbR='${k}';draw()">${n}</button>`).join('')}</div>
 <p style="color:var(--mut);font-size:13px;margin:-4px 0 12px">${rg[2]?`Readers within ${rg[2]} mi of you.`:`Readers in ${esc((ml&&ml.region)||'your state')}.`}${mineR?` You’re #${mineR.rank} of ${rows.length}.`:''}</p>
 ${rows.map(r=>`<div class="card item lb ${r.id===me.id?'me':''}"><div class="rk r${r.rank}">${r.rank}</div><div class="pa" style="--c:var(--pine)">${esc((r.name||'?')[0])}</div><div><b>${esc(r.name)}${r.id===me.id?' (you)':''}</b><small>${esc(r.place)}</small></div><div class="sc"><b>${r.score}</b><small>${{read:'read',lent:'lent',streak:'day streak',pages:'pages'}[lbM]}</small></div></div>`).join('')}
 ${rows.length<2?`<div class="card empty"><b class="serif" style="font-size:16px">You’re the only one here so far</b><p>Mark books as read on your shelf, or lend a book to get on the board. Try a wider range to see more readers.</p></div>`:''}`}

/* ---------- reading streaks + progress ---------- */
let logOpen=0,logBook='',logPg='',logDay=0;
const LEVELS=[[0,'New Reader'],[50,'Page Turner'],[200,'Bookworm'],[500,'Night Reader'],[1000,'Shelf Scholar'],[2500,'Library Regular'],[5000,'Bibliophile'],[10000,'Wise Owl'],[25000,'Grand Librarian']];
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dayAdd=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n,12))};
function rlOf(id){const u=(DB.users||{})[id]||{};const o=u.rl||{},r={};for(const k in o){const e=o[k];const p=e&&typeof e==='object'?+e.p:+e;if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&p>0)r[k]={p,t:e&&e.t||''}}return r}
function streakOf(id){const r=rlOf(id),days=Object.keys(r).sort(),t=dkey(Date.now());
 let best=0,run=0,prev=null;days.forEach(d=>{run=prev&&dayAdd(prev,1)===d?run+1:1;if(run>best)best=run;prev=d});
 let cur=0,c=r[t]?t:dayAdd(t,-1);while(r[c]){cur++;c=dayAdd(c,-1)}
 const pages=days.reduce((s,d)=>s+r[d].p,0);
 return {cur,best,pages,days:days.length,today:!!r[t],log:r}}
function levelOf(p){let i=0;LEVELS.forEach((l,j)=>{if(p>=l[0])i=j});const nx=LEVELS[i+1];return {n:i+1,name:LEVELS[i][1],from:LEVELS[i][0],next:nx?nx[0]:null,nname:nx?nx[1]:''}}
function badgesOf(s,read){return [
 ['📖','First log',s.days>=1],['🔥','3-day streak',s.best>=3],['🔥','7-day streak',s.best>=7],['🌟','30-day streak',s.best>=30],['👑','100-day streak',s.best>=100],
 ['📄','100 pages',s.pages>=100],['📚','1,000 pages',s.pages>=1000],['🦉','5,000 pages',s.pages>=5000],
 ['✅','First book',read>=1],['🏅','5 books',read>=5],['🏆','10 books',read>=10]]}
function weekStrip(s){const t=dkey(Date.now());return `<div class="wk">${[6,5,4,3,2,1,0].map(n=>{const k=dayAdd(t,-n),on=!!s.log[k],x=new Date(...k.split('-').map((v,i)=>i===1?v-1:+v),12);
 return `<div class="${on?'on':''} ${n===0?'td':''}"><i>${on?'🔥':''}</i><small>${'SMTWTFS'[x.getDay()]}</small></div>`}).join('')}</div>`}
function streakCard(){const s=streakOf(me.id),lv=levelOf(s.pages),risk=s.cur>0&&!s.today;
 const pct=lv.next?Math.min(100,(s.pages-lv.from)/(lv.next-lv.from)*100):100;
 const form=logOpen?`<form class="logf" onsubmit="logGo();return false"><input class="ri" id="lb" list="lbl" maxlength="60" placeholder="Book (pick or type)" value="${esc(logBook)}" oninput="logBook=this.value"><datalist id="lbl">${lib.map(b=>`<option value="${esc(b.t)}">`).join('')}</datalist>
 <div class="two"><input class="ri" id="lp" type="number" inputmode="numeric" min="1" max="2000" placeholder="Pages read" value="${esc(logPg)}" oninput="logPg=this.value"><div class="seg" style="margin:0"><button type="button" class="${logDay?'':'on'}" onclick="logDay=0;draw()">Today</button><button type="button" class="${logDay?'on':''}" onclick="logDay=1;draw()">Yesterday</button></div></div>
 <div class="two"><button class="btn acc" type="submit">Save</button><button class="btn ghost" type="button" onclick="logOpen=0;draw()">Cancel</button></div></form>`
 :`<button class="btn acc" onclick="logOpen=1;draw()">${s.today?'Log more reading':'Log today’s reading'}</button>`;
 return `<div class="card streak"><div class="item"><div class="flame ${s.cur?'':'cold'}">🔥<b>${s.cur}</b></div><div style="flex:1"><b class="serif" style="font-size:19px">${s.cur?s.cur+'-day streak':'No streak yet'}</b><small>${risk?'Read today to keep it going':s.cur?'You’re on a roll. Longest: '+s.best:'Log some pages to start one'}</small></div></div>
 ${weekStrip(s)}<div class="lvl"><div class="item" style="gap:6px"><b>Level ${lv.n} · ${lv.name}</b><small style="margin-left:auto">${s.pages.toLocaleString()} pages</small></div><div class="bar2"><i style="width:${pct}%"></i></div>${lv.next?`<small>${(lv.next-s.pages).toLocaleString()} pages to ${lv.nname}</small>`:'<small>Top level reached</small>'}</div>${form}</div>`}
function logGo(){const p=Math.round(+logPg),t=(logBook||'').replace(/[<>&"`\\$]/g,'').trim().slice(0,60);
 if(!(p>=1&&p<=2000)){toast('Enter pages read, between 1 and 2000');return}
 const d=dayAdd(dkey(Date.now()),logDay?-1:0),old=rlOf(me.id)[d],before=streakOf(me.id).cur;
 dbSet(`users/${me.id}/rl/${d}`,{p:(old?old.p:0)+p,t:t||(old?old.t:'')});
 const s=streakOf(me.id);logOpen=0;logBook='';logPg='';logDay=0;draw();
 toast(s.cur>before?`🔥 ${s.cur}-day streak! +${p} pages`:`+${p} pages logged`)}
function progressView(){const s=streakOf(me.id),st=stats(me.id),lv=levelOf(s.pages),bd=badgesOf(s,st.read),got=bd.filter(b=>b[2]).length;
 const wk=Object.keys(s.log).filter(k=>k>=dayAdd(dkey(Date.now()),-6)).reduce((a,k)=>a+s.log[k].p,0);
 const byB={};Object.values(s.log).forEach(e=>{if(e.t)byB[e.t]=(byB[e.t]||0)+e.p});const top=Object.entries(byB).sort((a,b)=>b[1]-a[1])[0];
 const cell=(v,l)=>`<div class="card sc2"><b>${v}</b><small>${l}</small></div>`;
 return `<div class="grid2">${cell(s.pages.toLocaleString(),'Total pages')}${cell(st.read,'Books finished')}${cell(s.cur,'Current streak')}${cell(s.best,'Longest streak')}${cell(s.days,'Days read')}${cell(s.days?Math.round(s.pages/s.days):0,'Avg pages / day')}${cell(wk,'Pages this week')}${cell(st.lent,'Books lent')}</div>
 ${top?`<p style="color:var(--mut);font-size:13px;margin:0 0 12px">Most read: <b>${esc(top[0])}</b> (${top[1].toLocaleString()} pages)</p>`:''}
 <h3 style="margin:6px 0 8px">Badges <small style="color:var(--mut);font-weight:400">${got} of ${bd.length}</small></h3><div class="bdg">${bd.map(b=>`<div class="${b[2]?'on':''}"><i>${b[0]}</i><small>${b[1]}</small></div>`).join('')}</div>`}

/* ---------- shelf: 3-up grid + search ---------- */
let shq='',shSel=-1;
function shPick(i){shSel=shSel===i?-1:i;const w=$('shwrap');if(w)w.innerHTML=shelfInner();else draw()}
function shSearch(v){shq=v;shSel=-1;const w=$('shwrap');if(w)w.innerHTML=shelfInner()}
function shelfInner(){const q=shq.trim().toLowerCase(),items=lib.map((b,i)=>[b,i]).filter(([b])=>!q||(b.t+' '+(b.a||'')).toLowerCase().includes(q)),sb=lib[shSel];
 const panel=sb&&items.some(([,i])=>i===shSel)?`<div class="card shp"><div class="item"><div style="flex:1"><b class="serif" style="font-size:17px">${esc(sb.t)}</b><small>${esc(sb.a||'')}</small><span class="tag ${sb.on?'':'off'}">${sb.lent?'Lent to '+esc(sb.lent):sb.on?'Visible to neighbors':'Hidden'}</span></div><button class="chip" aria-label="Close" onclick="shPick(${shSel})">✕</button></div><div class="two" style="margin-top:10px"><button class="chip ${sb.read?'on':''}" onclick="readB(${shSel})">${sb.read?'Read ✓':'Mark as read'}</button><button class="chip ${sb.on?'on':''}" onclick="togB(${shSel})">${sb.on?'Shared: tap to hide':'Hidden: tap to share'}</button></div></div>`:'';
 const grid=items.length?`<div class="shg">${items.map(([b,i])=>`<button class="shi bk ${shSel===i?'sel':''} ${b.on||b.lent?'':'off'}" aria-label="${esc(b.t)}" onclick="shPick(${i})">${cv(b)}${b.read?'<em class="rd" title="Read">✓</em>':''}${b.lent?'<em class="ln">Lent</em>':''}<small>${esc(b.t)}</small></button>`).join('')}</div>`:`<div class="card empty"><b class="serif" style="font-size:16px">No matches</b><p>Nothing on your shelf matches “${esc(shq)}”.</p></div>`;
 return panel+grid+`<p style="color:var(--mut);font-size:13px">Tap a book to mark it read or hide it from neighbors.</p>`}
function shelfView(){return `<form class="shs" onsubmit="document.activeElement.blur();return false"><input class="ri" id="shq" type="search" aria-label="Search your shelf" placeholder="Search your shelf (${lib.length} book${lib.length===1?'':'s'})" value="${esc(shq)}" oninput="shSearch(this.value)" autocomplete="off"><button class="chip on" type="submit" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></form><div id="shwrap">${shelfInner()}</div>`}

/* ---------- notifications ---------- */
function notify(){const R=Object.values(DB.requests||{}),cur={};R.forEach(r=>{if(r.to===me.id||r.from===me.id)cur[r.id]=r.status});
 if(seen)R.forEach(r=>{if(r.to===me.id&&!(r.id in seen)){if(r.status==='pending')toast(`${r.fromName} wants to borrow ${r.t}`)}
  else if(r.from===me.id&&seen[r.id]&&seen[r.id]!==r.status&&r.status!=='returned'){upd++;toast(r.status==='approved'?`${r.toName} approved ${r.t}. Check Activity`:`${r.toName} declined ${r.t}`)}});
 seen=cur;
 if(tnote)tItems().forEach(i=>{if(!tnote.has(i.key)){tnote.add(i.key);toast(i.text)}})}
function badge(){const R=Object.values(DB.requests||{});let n=R.filter(r=>r.to===me.id&&r.status==='pending').length+upd;if(tseen)n+=tItems().filter(i=>i.fresh).length;return n}

/* ---------- sign-up / login ---------- */
function showLoc(){const e=$('locline');if(!e)return;
 if(locSt==='detecting'){e.innerHTML='Finding your area…';return}
 if(LOC&&LOC.src!=='default')e.innerHTML=`${ic('pin')} Near <b>${esc(locLabel(LOC))}</b><br><button class="chip" onclick="preciseLoc()">${LOC.src==='gps'?'Precise location on ✓':'Use precise location'}</button>`;
 else e.innerHTML=`Couldn’t detect your area automatically. Pick the closest:<select id="lsel" class="ri" aria-label="Closest city" onchange="pickPreset(this.value)">${PRESETS.map((p,i)=>`<option value="${i}" ${LOC&&LOC.city===p.city?'selected':''}>${esc(p.city)}, ${esc(p.region)}</option>`).join('')}</select><button class="chip" style="margin-top:8px" onclick="preciseLoc()">Or use precise location</button>`}
function detectLoc(){if(locP)return locP;locSt='detecting';showLoc();
 locP=ipLoc().then(l=>{LOC=l||{...PRESETS[0],src:'default'};locSt=l?'ok':'failed';showLoc();return LOC});return locP}
function pickPreset(i){LOC={...PRESETS[+i],src:'manual'};locSt='ok';if(!me)showLoc()}
function preciseLoc(){const e=$('locline');if(e)e.innerHTML='Waiting for your browser’s permission…';
 gpsLoc().then(l=>{LOC=l;locSt='ok';if(me){dbSet(`users/${me.id}/loc`,l);rebuild();draw();toast('Location updated')}else showLoc()})
 .catch(()=>{if(me)toast('Couldn’t get precise location. Check your browser’s permission.');else showLoc()})}
let amode='up',abusy=0,aemail='';
const AERR={EMAIL_EXISTS:'That email already has an account. Try logging in instead.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',INVALID_PASSWORD:'Wrong email or password.',EMAIL_NOT_FOUND:'Wrong email or password.',WEAK_PASSWORD:'Use at least 6 characters for your password.',INVALID_EMAIL:'That doesn’t look like a valid email address.',MISSING_PASSWORD:'Enter your password.',MISSING_EMAIL:'Enter your email.',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many attempts. Wait a few minutes and try again.',USER_DISABLED:'This account has been disabled.',OPERATION_NOT_ALLOWED:'Email sign-in isn’t turned on in Firebase yet.',NETWORK:'Can’t reach the server. Check your connection.',API_KEY_INVALID:'Setup problem: the Firebase API key is wrong.',CONFIGURATION_NOT_FOUND:'Setup problem: turn on Authentication in Firebase.'};
const aerr=m=>{const e=$('aerr');if(e)e.textContent=m||''};
const aMsg=e=>CFG.API_KEY.startsWith('__')?'Setup incomplete: add the Firebase Web API key (see README).':(AERR[e&&e.code]||'Something went wrong. Please try again.');
function setMode(m){const e=$('ue');if(e)aemail=e.value;amode=m;draw()}
function abusyOn(on){abusy=on;const b=$('abtn');if(b){b.disabled=!!on;b.style.opacity=on?.6:1}}
function onboard(){const up=amode==='up',rs=amode==='reset',f='class="ri" style="width:100%;border-radius:14px;padding:12px"';
 return `<div style="min-height:100%;display:flex;flex-direction:column;justify-content:center"><img class="logo" src="icons/logo.png" width="150" alt="ShelfShare: an open book with a flower growing from it" onerror="this.remove()">
 <div class="seg" style="margin-bottom:6px"><button class="${up?'on':''}" onclick="setMode('up')">Create account</button><button class="${!up?'on':''}" onclick="setMode('in')">Log in</button></div>
 <form onsubmit="event.preventDefault();authGo()" novalidate>
 ${up?`<label class="lbl" for="un" style="margin-top:6px">What should neighbors call you?</label><input id="un" ${f} maxlength="20" placeholder="e.g. Alex" autocomplete="nickname">`:''}
 <label class="lbl" for="ue" style="margin-top:${up?'':'6px'}">Email</label><input id="ue" type="email" inputmode="email" ${f} placeholder="you@example.com" autocomplete="email" autocapitalize="none" value="${esc(aemail)}">
 ${rs?'':`<label class="lbl" for="up">Password${up?' <span style="font-weight:400;color:var(--mut)">(at least 6 characters)</span>':''}</label><input id="up" type="password" ${f} autocomplete="${up?'new-password':'current-password'}"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);margin-top:6px"><input type="checkbox" onchange="$('up').type=this.checked?'text':'password'"> Show password</label>`}
 ${up?`<label class="lbl" for="ut">Your building or neighborhood <span style="font-weight:400;color:var(--mut)">(optional)</span></label><input id="ut" ${f} maxlength="30" placeholder="e.g. Maple Court Apartments" autocomplete="off"><label class="lbl" for="ur">Referral code <span style="font-weight:400;color:var(--mut)">(optional, 25% off your first month)</span></label><input id="ur" ${f} maxlength="12" placeholder="e.g. ALEX-7K2Q" autocomplete="off" autocapitalize="characters" value="${esc(refIn)}"><p id="locline" class="loc"></p>`:''}
 <p id="aerr" role="alert" style="color:#a3392b;font-size:13px;min-height:18px;margin:8px 0 0"></p>
 <button id="abtn" class="btn acc" type="submit">${up?'Create account':rs?'Send reset link':'Log in'}</button></form>
 ${amode==='in'?`<button class="back" style="margin:6px auto 0;display:block" onclick="setMode('reset')">Forgot password?</button>`:''}${rs?`<button class="back" style="margin:6px auto 0;display:block" onclick="setMode('in')">‹ Back to log in</button>`:''}
 ${up?`<p style="color:var(--mut);font-size:13px;margin-top:10px;text-align:center">We’ll put three classics on your shelf so neighbors have something to borrow right away.</p><p class="loc" style="font-size:12px">We use your connection to find your approximate area. Neighbors only see roughly where you are (rounded to under a mile), never your address or email.</p>`:''}</div>`}
async function authGo(){if(abusy)return;if(amode==='up')return signUp();if(amode==='reset')return resetPw();return logIn()}
const cleanName=s=>String(s||'').replace(/[^\p{L}\p{N} .'’-]/gu,'').trim();
const emailVal=()=>(($('ue')||{}).value||'').trim().toLowerCase(),pwVal=()=>($('up')||{}).value||'';
async function resetPw(){const em=emailVal();if(!em)return aerr('Enter your email first.');abusyOn(1);aerr('');
 try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email:em});const e=$('aerr');if(e){e.style.color='var(--pine,#4E5B3A)';e.textContent='If that email has an account, a reset link is on its way. Check spam too.'}}
 catch(e){aerr(e.code==='EMAIL_NOT_FOUND'?'If that email has an account, a reset link is on its way. Check spam too.':aMsg(e))}abusyOn(0)}
async function logIn(){const em=emailVal(),pw=pwVal();if(!em)return aerr('Enter your email.');if(!pw)return aerr('Enter your password.');abusyOn(1);aerr('');
 try{setAuth(await authCall('signInWithPassword',{email:em,password:pw,returnSecureToken:true}));await enter(false)}
 catch(e){if(AU&&!me){AU=null;ls.del('ss_auth')}aerr(e.enterMsg||aMsg(e))}abusyOn(0)}
async function signUp(){const name=cleanName(($('un')||{}).value).slice(0,20),unit=cleanName(($('ut')||{}).value).slice(0,30),em=emailVal(),pw=pwVal();
 if(!name)return aerr('Enter a name neighbors will see.');if(!em)return aerr('Enter your email.');if(pw.length<6)return aerr('Use at least 6 characters for your password.');abusyOn(1);aerr('');
 try{setAuth(await authCall('signUp',{email:em,password:pw,returnSecureToken:true}));ls.set('ss_pn_'+AU.uid,JSON.stringify({name,unit,ref:cleanRef(($('ur')||{}).value)}));await enter(true)}
 catch(e){if(AU&&!me){AU=null;ls.del('ss_auth')}aerr(e.enterMsg||aMsg(e))}abusyOn(0)}
/* the profile lives in the database under the account's uid */
async function makeProfile(name,unit,refCode){const U=DB.users||{},loc=await Promise.race([detectLoc(),new Promise(r=>setTimeout(()=>r(LOC||{...PRESETS[0],src:'default'}),6000))]);
 const books={};
 const rb=refCode&&Object.entries(U).find(([id,u])=>u&&u.ref===refCode&&id!==AU.uid);
 const rec={name,unit,ref:genRef(name,AU.uid,U),joined:Date.now(),loc:{lat:loc.lat,lon:loc.lon,city:loc.city||'',region:loc.region||'',cc:loc.cc||'',src:loc.src||'ip'},books};if(rb)rec.refBy=rb[0];
 if(!(await dbSet('users/'+AU.uid,rec)))throw Object.assign(new Error('profile'),{enterMsg:'Your account was created but we couldn’t save your profile. Log in again to retry.'});return rec}
async function enter(fresh,silent){await sync(true);
 if(!DBok){const x=new Error('db');x.enterMsg='Signed in, but couldn’t load the neighborhood. Check your connection and try again.';throw x}
 let u=(DB.users||{})[AU.uid],created=false;
 if(!u){let pn={};try{pn=JSON.parse(ls.get('ss_pn_'+AU.uid)||'{}')}catch(e){}
  const nm=cleanName(pn.name||(AU.email||'').split('@')[0].replace(/[^\p{L}\p{N}]/gu,' ')).slice(0,20)||'Neighbor';u=await makeProfile(nm,cleanName(pn.unit||'').slice(0,30),cleanRef(pn.ref));created=true;ls.del('ss_ref');if(pn.ref&&!u.refBy)setTimeout(()=>toast('That referral code wasn’t found, but you’re in!'),2600)}
 me={id:AU.uid,name:u.name,unit:u.unit||''};tab=(fresh||created)?'plan':'d';planSt=0;curClub=null;await afterLogin();draw();
 if(!silent)toast(fresh||created?`Welcome, ${me.name}. Scan your first book to start your shelf`:`Welcome back, ${me.name}`)}
async function afterLogin(){rebuild();
 if(!myLoc()){const l=LOC||await detectLoc();dbSet(`users/${me.id}/loc`,l)}
 if(!((DB.users||{})[me.id]||{}).ref)dbSet(`users/${me.id}/ref`,genRef(me.name,me.id,DB.users));
 rebuild();ensureClubs();
 let ts=[];try{ts=JSON.parse(ls.get('ss_ts_'+me.id)||'[]')}catch(e){}tseen=new Set(ts);tnote=new Set(tItems().map(i=>i.key));seen=null;upd=0;notify()}
function signOut(msg){ls.del('ss_auth');ls.del('ss_me');AU=null;me=null;DB={};last='';DBok=false;seen=null;tseen=null;tnote=null;tab='d';asec='share';csec='clubs';curClub=null;ropen=null;upd=0;amode='in';draw();if(typeof msg==='string')toast(msg)}

/* ---------- sync ---------- */
async function sync(force){if(pend||!AU)return;const w0=wver;let d;try{d=scrub(await load());DBok=true}catch(e){return}
 if(pend||wver!==w0)return;
 const j=JSON.stringify(d);if(j===last&&!force)return;last=j;DB=d;if(!me)return;if(!(DB.users||{})[me.id]){signOut('Your profile was reset. Please log in again.');return}
 rebuild();notify();resolveCovers();
 const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
 if(tab==='u'&&curClub){drawMsgs();tabs();return}
 if(['d','a','p','u'].includes(tab)&&!document.querySelector('.scrim,.scrim2')&&!typing&&!owlBusy)draw();else tabs()}

/* ---------- shell ---------- */
const TABS=[['d','Discover'],['f','Feed'],['s','Add'],['u','Community'],['p','Me']];
function tabs(){const bar=$('bar');if(!me||tab==='plan'){$('tabs').innerHTML='';bar.style.display='none';return}const b=badge();
 bar.style.display=(tab==='u'&&curClub)?'none':'flex';
 bar.innerHTML=`<span class="wm"><img src="icons/logo-256.png" width="34" height="31" alt="" onerror="this.remove()">ShelfShare</span><button class="bell ${tab==='a'?'on':''}" aria-label="Activity and notifications${b?', '+b+' new':''}" onclick="go('a')">${ic('a')}${b?`<b class="dot">${b}</b>`:''}</button>`;
 $('tabs').innerHTML=TABS.map(([k,n])=>k==='s'?`<button class="scan" onclick="go('s')"><span>${ic('s')}</span>${n}</button>`:`<button class="${tab===k||(tab==='detail'&&k==='d')||(tab==='post'&&k==='f')?'on':''}" onclick="go('${k}')">${ic(k)}${n}</button>`).join('')}
const VIEWS={d:discover,detail,f:feed,post:compose,s:scan,u:community,a:activity,p:profile,plan:planView};
function draw(){const s=$('screen');s.className=(me&&tab==='u'&&curClub)?'flush':'';
 if(!me){camStop();s.innerHTML=onboard();$('tabs').innerHTML='';showLoc();detectLoc();return}
 s.innerHTML=VIEWS[tab]();tabs();if(tab==='u'&&curClub)afterChat();if(tab==='s'&&scanSt===0)setTimeout(camStart,0);else camStop()}
setInterval(()=>{if(!document.hidden)sync()},2500);addEventListener('storage',()=>sync());
(async()=>{$('screen').innerHTML='<p style="color:var(--mut);margin-top:40%;text-align:center">Loading…</p>';let sv=null;try{sv=JSON.parse(ls.get('ss_auth')||'null')}catch(e){}
 if(sv&&sv.rt&&sv.uid){AU={uid:sv.uid,email:sv.email||'',rt:sv.rt,idt:'',exp:0};
  for(let i=0;i<5&&AU&&!me;i++){try{await enter(false,true)}catch(e){if(!AU)break;if(e.enterMsg&&/profile/.test(e.enterMsg))break;await sleep(2000)}}
  if(AU&&!me){AU=null;amode='in'}}
 draw()})();

</script></body></html>
