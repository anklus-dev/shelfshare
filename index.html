<script>
const CFG={FIREBASE_URL:'https://shelfshare-11e68-default-rtdb.firebaseio.com/'}; // Firebase Realtime Database URL (see README.md)
const LIVE=!!CFG.FIREBASE_URL,BASE=CFG.FIREBASE_URL.replace(/\/$/,'');
let DB={},me=null,last='',pend=0,wver=0,DBok=false,seen=null,mem={},LOC=null,locP=null,locSt='idle';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const IDK=new Set(['id','bookId','uid','from','to','lender','swapOf','tid']); // id-like fields end up inside inline handlers, so only safe characters survive
const scrub=d=>JSON.parse(JSON.stringify(d||{}),(k,v)=>typeof v!=='string'?v:IDK.has(k)?v.replace(/[^\p{L}\p{N}_-]/gu,''):v.replace(/[<>"`\\]/g,''));
const setIn=(o,p,v)=>{const a=p.split('/');let c=o;a.slice(0,-1).forEach(k=>c=c[k]=c[k]||{});if(v===null)delete c[a[a.length-1]];else c[a[a.length-1]]=v};
async function load(){if(LIVE){const r=await fetch(BASE+'/ss.json');if(!r.ok)throw 0;return (await r.json())||{}}return JSON.parse(ls.get('ss_db')||'{}')||{}}
async function save(p,v){pend++;try{if(LIVE){await fetch(`${BASE}/ss/${encodeURI(p)}.json`,{method:'PUT',body:JSON.stringify(v)})}else{const d=JSON.parse(ls.get('ss_db')||'{}')||{};setIn(d,p,v);ls.set('ss_db',JSON.stringify(d))}}catch(e){}pend--}
function dbSet(p,v){wver++;setIn(DB,p,v);return save(p,v)}

/* ---------- helpers ---------- */
const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const slug=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
const key=s=>slug(s)||'x';
const ago=ts=>{const s=Math.max(0,(Date.now()-(ts||0))/1000);return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const dl=n=>n===1?'1 day':n+' days';
const rad=x=>x*Math.PI/180;
const dist=(a,b)=>{if(!a||!b||a.lat==null||b.lat==null)return null;const R=3958.8,dA=rad(b.lat-a.lat),dO=rad(b.lon-a.lon);const h=Math.sin(dA/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtD=m=>m==null?'Distance unknown':m<0.3?'Nearby':m<10?m.toFixed(1)+' mi':Math.round(m)+' mi';
const away=m=>m==null?'Location unknown':m<0.3?'Right nearby':fmtD(m)+' away';
const r2=n=>Math.round(n*100)/100;
const myLoc=()=>((DB.users||{})[me&&me.id]||{}).loc;
const initials=s=>String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- location (rounded to ~1 km before it is ever stored) ---------- */
const PRESETS=[{city:'Atlanta',region:'Georgia',cc:'US',lat:33.75,lon:-84.39},{city:'Decatur',region:'Georgia',cc:'US',lat:33.77,lon:-84.30},{city:'Marietta',region:'Georgia',cc:'US',lat:33.95,lon:-84.55},{city:'Covington',region:'Georgia',cc:'US',lat:33.60,lon:-83.86},{city:'Athens',region:'Georgia',cc:'US',lat:33.96,lon:-83.38},{city:'Macon',region:'Georgia',cc:'US',lat:32.84,lon:-83.63},{city:'Augusta',region:'Georgia',cc:'US',lat:33.47,lon:-81.97},{city:'Savannah',region:'Georgia',cc:'US',lat:32.08,lon:-81.09}];
const mk=(lat,lon,city,region,cc,src)=>({lat:r2(+lat),lon:r2(+lon),city:String(city||'').slice(0,40),region:String(region||'').slice(0,40),cc:String(cc||'').slice(0,3),src});
const getJ=(url,ms=4500)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t);if(!r.ok)throw 0;return r.json()}).catch(e=>{clearTimeout(t);throw e})};
async function ipLoc(){
 const tries=[
  async()=>{const j=await getJ('https://ipwho.is/');if(!j||j.success===false||j.latitude==null)throw 0;return mk(j.latitude,j.longitude,j.city,j.region,j.country_code,'ip')},
  async()=>{const j=await getJ('https://get.geojs.io/v1/ip/geo.json');if(!j||j.latitude==null)throw 0;return mk(j.latitude,j.longitude,j.city,j.region,j.country_code,'ip')},
  async()=>{const j=await getJ('https://ipapi.co/json/');if(!j||j.latitude==null)throw 0;return mk(j.latitude,j.longitude,j.city,j.region,j.country_code,'ip')}];
 for(const f of tries){try{return await f()}catch(e){}}
 return null}
function gpsLoc(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(0);navigator.geolocation.getCurrentPosition(async p=>{const la=p.coords.latitude,lo=p.coords.longitude;let city='',region='',cc='';
 try{const j=await getJ(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=en`);city=j.city||j.locality||'';region=j.principalSubdivision||'';cc=j.countryCode||''}catch(e){}
 res(mk(la,lo,city,region,cc,'gps'))},()=>rej(0),{timeout:8000,maximumAge:600000})})}
const locLabel=l=>l?([l.city,l.region].filter(Boolean).join(', ')||'your area'):'';

/* ---------- app state ---------- */
let lib=[],want=[],near=[],asec='share',csec='clubs',curClub=null,ropen=null,rng=30,pop=0,tab='d',filt='all',seg='mine',det=null,scanSt=0,upd=0,newB=null,lbM='read',lbR='town',tseen=null,tnote=null,lastMsgHtml='';
let pc={b:0,mode:'Page',n:112,txt:'I can’t believe I waited this long to read it. The opening hooked me instantly.',sp:0};
const STL={pending:'Waiting',approved:'Accepted',declined:'Declined',returned:'Returned'};

/* ---------- navigation ---------- */
function go(t,d){tab=t;det=d||null;if(t==='a')upd=0;if(t==='u')curClub=null;scanSt=0;draw();$('screen').scrollTop=0}

/* ---------- derived data ---------- */
function rebuild(){
 const U=DB.users||{},R=Object.values(DB.requests||{}),meU=U[me.id]||{},ml=meU.loc,su=slug(meU.unit||'');
 const lentIds=new Set(R.filter(r=>r.status==='approved').map(r=>r.bookId));
 lib=Object.values(meU.books||{}).sort((x,y)=>x.id-y.id).map(b=>{const r=R.find(r=>r.bookId===b.id&&r.status==='approved');return {...b,lent:r&&r.fromName,due:r&&daysLeft(r),rid:r&&r.id,read:isRead(b.t)}});
 want=Object.values(meU.want||{});
 near=[];
 Object.entries(U).forEach(([id,u])=>{if(id===me.id)return;const d=dist(ml,u.loc),inB=!!su&&su===slug(u.unit||'')&&(d==null||d<2);
  Object.values(u.books||{}).forEach(b=>{if(!b.on||lentIds.has(b.id))return;near.push({id:b.id,t:b.t,a:b.a,c:b.c,o:u.name,w:u.unit||(u.loc&&u.loc.city)||'Nearby',mi:d==null?9999:d,d:away(d),b:inB?1:0,uid:id})})});
 near.sort((x,y)=>x.mi-y.mi||x.t.localeCompare(y.t))}
function swapFor(b){ // one of my available books that b's owner wants, if I want b
 if(!inWant(b.t))return null;const ou=(DB.users||{})[b.uid];if(!ou)return null;const ow=Object.values(ou.want||{}).map(slug);
 return lib.find(x=>x.on&&!x.lent&&ow.includes(slug(x.t)))||null}
const asked=b=>Object.values(DB.requests||{}).some(r=>r.from===me.id&&r.bookId===b.id&&(r.status==='pending'||r.status==='approved'));

/* ---------- discover ---------- */
function popup(){return `<div class="scrim" onclick="pop=0;draw()"><div class="sheet" onclick="event.stopPropagation()"><b class="serif" style="font-size:18px">Search range</b><p style="color:var(--mut);font-size:13px;margin-top:2px">Show books from neighbors within this distance.</p><div class="row" style="margin:12px 0 4px">${[1,10,30,50].map(n=>`<button class="chip ${rng===n?'on':''}" onclick="rng=${n};draw()">${n} mi</button>`).join('')}</div><button class="btn acc" onclick="pop=0;draw()">Show ${near.filter(b=>b.mi<=rng).length} books</button></div></div>`}
function discover(){
 const l=near.filter(b=>b.mi<=rng&&(filt==='all'||(filt==='b'&&b.b)||(filt==='n'&&!b.b))),ml=myLoc();
 let m=null;for(const b of near){if(b.mi>rng)continue;const mine=swapFor(b);if(mine){m={b,mine};break}}
 return `<div class="top"><div><h1>ShelfShare</h1><div class="tag-l">One Shared Shelf${ml&&ml.city?' · Near '+esc(ml.city):''}</div></div><button class="chip" onclick="pop=1;draw()" aria-label="Change search range">Within ${rng} mi ▾</button></div>${pop?popup():''}
 ${m?`<button class="match" onclick="go('detail',${m.b.id})"><div class="pair">${cv(m.b)}${cv(m.mine)}</div><div><b>Swap match with ${esc(m.b.o)}</b>${esc(m.b.o)} has ${esc(m.b.t)}, which you want. You have ${esc(m.mine.t)}, which ${esc(m.b.o)} wants.</div></button>`:''}
 <div class="row">${[['all','All nearby'],['b','My building'],['n','Outside my building']].map(([k,n])=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';draw()">${n}</button>`).join('')}</div>
 ${l.length?`<div class="grid">${l.map(b=>`<button class="bk" onclick="go('detail',${b.id})">${cv(b)}<p>${esc(b.t)}</p><small>${esc(b.o)} · ${esc(b.w)}</small><small>${b.b?'In your building':esc(b.d)}</small></button>`).join('')}</div>`
 :`<div class="card empty"><b class="serif" style="font-size:18px">No books within ${rng} mi yet</b><p>${near.length?'Widen your range to see books from farther away.':'You’re the first one here. Neighbors who join will show up automatically.'}</p>${near.length?'<button class="btn acc" onclick="pop=1;draw()">Change range</button>':''}</div>`}`}
function detail(){
 const b=near.find(x=>x.id===det);
 if(!b)return `<button class="back" onclick="go('d')">‹ Back to discover</button><p style="color:var(--mut)">This book isn’t available right now.</p>`;
 const done=asked(b),mine=swapFor(b),tt=thoughtsArr().filter(t=>slug(t.t)===slug(b.t)).slice(0,3);
 return `<button class="back" onclick="go('d')">‹ Back to discover</button>
 <div class="hero">${cv(b)}<div><h2 style="font-size:24px;line-height:1.1">${esc(b.t)}</h2><p style="color:var(--mut);margin:4px 0 10px">${esc(b.a)}</p><span class="tag">Available</span><p style="margin-top:12px"><b>${esc(b.o)}</b><br><span style="color:var(--mut)">${esc(b.w)} · ${b.b?'In your building':esc(b.d)}</span></p></div></div>
 ${mine&&!done?`<div class="swap"><b class="serif" style="font-size:17px">You can swap</b><p style="font-size:13px;margin-top:2px">${esc(b.t)} is on your want list, and ${esc(b.o)} wants ${esc(mine.t)}.</p><div class="pair">${cv(mine)}<span style="font-size:22px">⇄</span>${cv(b)}</div><button class="btn acc" onclick="req(${b.id},1)">Propose swap</button></div>`:''}
 ${done?`<p class="tag" style="padding:10px 14px">Request sent to ${esc(b.o)}. Check Activity for updates.</p>`:`<button class="btn ${mine?'ghost':''}" onclick="req(${b.id},0)">${mine?'Borrow without swapping':'Request to borrow'}</button>`}
 <button class="btn ghost" onclick="toggleWant(${b.id});draw()">${inWant(b.t)?'✓ On your want list':'Mark as want to read'}</button>
 ${tt.length?`<h3 style="margin:18px 0 8px">What neighbors think</h3>`+tt.map(t=>`<div class="card"><b>${esc(t.who)}</b> <small style="color:var(--mut)">${esc(t.loc)}</small><p class="q">${t.spoil?'Spoiler hidden. Open the feed to reveal.':esc(t.txt)}</p></div>`).join(''):''}`}

/* ---------- book options sheet (opened from the feed) ---------- */
const wl=t=>inWant(t)?'✓ On your want list<small>Tap to remove</small>':'Mark as want to read<small>We’ll flag swap matches for you</small>';
function sheet(id){const b=near.find(x=>x.id===id);if(!b)return;const done=asked(b),mine=swapFor(b);
 const e=document.createElement('div');e.className='scrim2';e.id='sheet';e.onclick=closeSheet;
 e.innerHTML=`<div class="sh" role="dialog" aria-label="Options for ${esc(b.t)}" onclick="event.stopPropagation()"><div class="grab"></div><div class="item" style="margin-bottom:4px">${cv(b)}<div><b class="serif" style="font-size:18px">${esc(b.t)}</b><small>${esc(b.a)}</small><small>${esc(b.o)} · ${esc(b.w)}</small><small>${b.b?'In your building':esc(b.d)}</small></div></div>
 ${done?`<p class="tag" style="display:block;margin-top:10px;padding:10px 14px">Request already sent to ${esc(b.o)}</p>`:`${mine?`<button class="opt pri" onclick="closeSheet();req(${b.id},1)">Propose a swap<small>Trade ${esc(mine.t)} for ${esc(b.t)}</small></button>`:''}<button class="opt ${mine?'':'pri'}" onclick="closeSheet();req(${b.id},0)">${mine?'Borrow without swapping':'Request to borrow'}<small>${esc(b.o)} usually lends for two weeks</small></button>`}
 <button class="opt" id="wb" onclick="toggleWant(${b.id})">${wl(b.t)}</button>
 <button class="opt" onclick="closeSheet();go('detail',${b.id})">View book page<small>See what neighbors think of it</small></button>
 <button class="btn ghost" onclick="closeSheet()">Close</button></div>`;$('app').appendChild(e)}
function closeSheet(){const e=$('sheet');if(!e)return;e.id='';e.classList.add('out');setTimeout(()=>e.remove(),230)}

/* ---------- want list ---------- */
function toggleWantT(t){const has=inWant(t);dbSet(`users/${me.id}/want/${key(t)}`,has?null:t);rebuild();return !has}
function toggleWant(id){const b=near.find(x=>x.id===id);if(!b)return;const added=toggleWantT(b.t);const w=$('wb');if(w)w.innerHTML=wl(b.t);toast(added?'Added to your want to read list':'Removed from your want to read list')}
function addWant(){const i=$('wi');const v=(i&&i.value||'').replace(/[<>&"`\\$]/g,'').trim().slice(0,60);if(!v)return;if(!inWant(v))dbSet(`users/${me.id}/want/${key(v)}`,v);rebuild();draw();toast('Added to your want to read list')}
function rmWant(k){dbSet(`users/${me.id}/want/${k}`,null);rebuild();draw()}

/* ---------- requests ---------- */
function req(id,sw){const b=near.find(x=>x.id===id);if(!b)return;realReq(b,sw?swapFor(b):null)}
function realReq(b,offer){const id='r'+uid(),rec={id,bookId:b.id,t:b.t,a:b.a,c:b.c,from:me.id,fromName:me.name,to:b.uid,toName:b.o,status:'pending',ts:Date.now()};
 if(offer)rec.offer={id:offer.id,t:offer.t,a:offer.a,c:offer.c};
 dbSet('requests/'+id,rec);if(seen)seen[id]='pending';asec='share';go('a');toast(offer?'Swap proposed to '+b.o:'Request sent to '+b.o)}
function apR(id,ok){const r=(DB.requests||{})[id];if(!r)return;const now=Date.now();
 dbSet('requests/'+id,{...r,status:ok?'approved':'declined',appTs:now});
 if(ok&&r.offer){const id2='r'+uid();dbSet('requests/'+id2,{id:id2,bookId:r.offer.id,t:r.offer.t,a:r.offer.a,c:r.offer.c,from:r.to,fromName:r.toName,to:r.from,toName:r.fromName,status:'approved',ts:now,appTs:now,swapOf:id})}
 rebuild();draw();toast(ok?(r.offer?`Swap confirmed with ${r.fromName}`:`${r.fromName} has been told. ${r.t} is marked as lent`):'Request declined')}
function retR(id){const r=(DB.requests||{})[id];if(!r)return;dbSet('requests/'+id,{...r,status:'returned'});rebuild();draw();toast('Marked as returned. It’s back on your shelf')}
function extendR(id){const r=(DB.requests||{})[id];if(!r)return;dbSet(`requests/${id}/ext`,(r.ext||0)+7);rebuild();draw();toast('Extended by a week. '+r.toName+' has been told.')}
function readL(id){const r=(DB.requests||{})[id];if(r)markRead(r.t,r.a,r.c)}
function markRead(t,a,c){const k=key(t),has=isRead(t);dbSet(`users/${me.id}/read/${k}`,has?null:{t,a:a||'',c:c||'',ts:Date.now()});rebuild();draw();toast(has?'Removed from your read list':'Marked as read. It counts toward your leaderboard rank')}
function readB(i){const b=lib[i];if(b)markRead(b.t,b.a,b.c)}
function togB(i){const b=lib[i];if(!b)return;dbSet(`users/${me.id}/books/b${b.id}/on`,b.on?0:1);rebuild();draw()}

/* ---------- feed (shared thoughts) ---------- */
function repliesHTML(t){return `<div class="reps">${reps(t).map(r=>`<p class="rp"><b>${esc(r.who)}</b> ${esc(r.txt)} <small style="color:var(--mut)">${ago(r.ts)}</small></p>`).join('')}<div class="two" style="margin-top:8px;align-items:center"><input class="ri" id="ri" aria-label="Reply to ${esc(t.who)}" maxlength="240" placeholder="Write a reply" onkeydown="if(event.key==='Enter')sendR('${t.id}')"><button class="chip on" onclick="sendR('${t.id}')">Send</button></div></div>`}
function card(t){const nb=near.find(b=>slug(b.t)===slug(t.t)),mineT=t.uid===me.id;
 return `<article class="post ${t.spoil?'blur':''}" id="r${t.id}" style="--c:${esc(t.c||'#6B4226')}"><div class="ph"><div class="pa">${esc((t.who||'?')[0])}</div><div><b>${esc(mineT?'You':t.who)}</b><small>${esc(t.t)} · ${esc(t.loc)} · ${ago(t.ts)}</small></div>${t.lender===me.id?'<span class="tag" style="background:var(--acc);color:var(--accink)">On your copy</span>':''}</div>
 <div class="stage">${cv({t:t.t,a:t.a,c:t.c||'#6B4226'})}</div><blockquote class="pq" onclick="this.parentNode.classList.remove('blur')">${esc(t.txt)}</blockquote><p class="rv">Spoiler hidden. Tap to reveal.</p>
 <div class="acts"><button class="lk ${(t.likes||{})[me.id]?'on':''}" aria-label="Like" onclick="like('${t.id}')">${ic('h')}<span>${nLikes(t)}</span></button><button aria-label="Replies" onclick="toggleReplies('${t.id}')">${ic('c')}<span>${reps(t).length}</span></button>${nb?`<button class="sub" aria-label="Options for ${esc(nb.t)}" onclick="sheet(${nb.id})"><span class="pa">${esc(nb.o[0])}</span><span class="tx"><b>${esc(nb.o)}${nb.uid===t.uid?' has':' also has'} this book</b><small>${nb.b?'In your building':esc(nb.d)}</small></span><span class="ch">›</span></button>`:''}</div>${ropen===t.id?repliesHTML(t):''}</article>`}
function feed(){const L=thoughtsArr();
 return `<div class="fh"><h1 style="font-size:28px">Feed</h1><button class="chip on" onclick="go('post')">+ Add thought</button></div>`+(L.length?L.map(card).join(''):`<div class="card empty"><b class="serif" style="font-size:18px">No thoughts yet</b><p>Share what you think as you read. Neighbors who borrow your books will see it.</p><button class="btn acc" onclick="go('post')">Share the first thought</button></div>`)}
function toggleReplies(id){ropen=ropen===id?null:id;draw();if(ropen)setTimeout(()=>{const i=$('ri');i&&i.focus()},30)}
function like(id){const t=(DB.thoughts||{})[id];if(!t)return;const has=(t.likes||{})[me.id];dbSet(`thoughts/${id}/likes/${me.id}`,has?null:1);draw()}
function sendR(tid){const t=(DB.thoughts||{})[tid],i=$('ri');if(!t||!i)return;const v=i.value.trim().slice(0,240);if(!v)return;const rid='p'+uid();
 dbSet(`thoughts/${tid}/replies/${rid}`,{id:rid,uid:me.id,who:me.name,txt:v,ts:Date.now()});draw();toast('Reply sent to '+t.who)}
function seeT(id,open){tab='f';det=null;ropen=open?id:null;draw();const el=$('r'+id);if(el)el.scrollIntoView({block:'center'})}

/* ---------- share a thought ---------- */
function readingList(){const R=Object.values(DB.requests||{}),seenT=new Set(),out=[];
 R.filter(r=>r.from===me.id&&r.status==='approved').forEach(r=>{out.push({t:r.t,a:r.a,c:r.c,lender:r.to,from:r.toName});seenT.add(slug(r.t))});

  dbSet(`clubmsgs/${id}/m1`,{id:'m1',uid:'sys',who:'ShelfShare',txt:first,ts:Date.now()})};
 CT.forEach(([k,n,d,kind,dx,dy,first])=>{const name=n.replace('{c}',c).replace('{s}',s);
  make('auto-'+base+'-'+k,name,d.replace('{c}',c),kind,Math.round((loc.lat+dy/69)*1000)/1000,Math.round((loc.lon+dx/(69*Math.cos(rad(loc.lat))))*1000)/1000,first.replace('{n}',name).replace('{s}',s))});
 const unit=(u.unit||'').trim(),mine=['auto-'+base+'-readers'];
 if(unit&&slug(unit)){const id='bld-'+slug(unit)+'-'+base;make(id,unit+' Book Club','Neighbors of '+unit+'. Swap books and talk about what you’re reading.','building',loc.lat,loc.lon,`Welcome, neighbors of ${unit}! Say hi and share a book from your shelf.`);mine.unshift(id)}
 mine.forEach(id=>{if(!((((DB.clubs||{})[id]||{}).members||{})[me.id]))dbSet(`clubs/${id}/members/${me.id}`,1)})}

/* leaderboard */
function board(metric,range){const U=DB.users||{},ml=myLoc(),rg=RANGES.find(x=>x[0]===range);
 const rows=Object.entries(U).filter(([id,u])=>{if(id===me.id)return true;if(!ml||!u.loc)return false;
  if(rg[2]==null)return slug(u.loc.region)===slug(ml.region)&&(u.loc.cc||'')===(ml.cc||'');const d=dist(ml,u.loc);return d!=null&&d<=rg[2]})
  .map(([id,u])=>({id,name:u.name||id,place:u.unit||(u.loc&&u.loc.city)||'',score:stats(id)[metric]}));
 rows.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
 rows.forEach((r,i)=>{r.rank=i&&rows[i-1].score===r.score?rows[i-1].rank:i+1});return rows}
function leaderboard(){const rows=board(lbM,lbR),mineR=rows.find(r=>r.id===me.id),rg=RANGES.find(x=>x[0]===lbR),ml=myLoc();
 return `<div class="seg"><button class="${lbM==='read'?'on':''}" onclick="lbM='read';draw()">Books read</button><button class="${lbM==='lent'?'on':''}" onclick="lbM='lent';draw()">Books lent</button></div>
 <div class="row" style="margin-top:0">${RANGES.map(([k,n])=>`<button class="chip ${lbR===k?'on':''}" onclick="lbR='${k}';draw()">${n}</button>`).join('')}</div>
 <p style="color:var(--mut);font-size:13px;margin:-4px 0 12px">${rg[2]?`Readers within ${rg[2]} mi of you.`:`Readers in ${esc((ml&&ml.region)||'your state')}.`}${mineR?` You’re #${mineR.rank} of ${rows.length}.`:''}</p>
 ${rows.map(r=>`<div class="card item lb ${r.id===me.id?'me':''}"><div class="rk r${r.rank}">${r.rank}</div><div class="pa" style="--c:var(--pine)">${esc((r.name||'?')[0])}</div><div><b>${esc(r.name)}${r.id===me.id?' (you)':''}</b><small>${esc(r.place)}</small></div><div class="sc"><b>${r.score}</b><small>${lbM==='read'?'read':'lent'}</small></div></div>`).join('')}
 ${rows.length<2?`<div class="card empty"><b class="serif" style="font-size:16px">You’re the only one here so far</b><p>Mark books as read on your shelf, or lend a book to get on the board. Try a wider range to see more readers.</p></div>`:''}`}

/* ---------- notifications ---------- */
function notify(){const R=Object.values(DB.requests||{}),cur={};R.forEach(r=>{if(r.to===me.id||r.from===me.id)cur[r.id]=r.status});
 if(seen)R.forEach(r=>{if(r.to===me.id&&!(r.id in seen)){if(r.status==='pending')toast(`${r.fromName} wants to borrow ${r.t}`)}
  else if(r.from===me.id&&seen[r.id]&&seen[r.id]!==r.status&&r.status!=='returned'){upd++;toast(r.status==='approved'?`${r.toName} approved ${r.t}. Check Activity`:`${r.toName} declined ${r.t}`)}});
 seen=cur;
 if(tnote)tItems().forEach(i=>{if(!tnote.has(i.key)){tnote.add(i.key);toast(i.text)}})}
function badge(){const R=Object.values(DB.requests||{});let n=R.filter(r=>r.to===me.id&&r.status==='pending').length+upd;if(tseen)n+=tItems().filter(i=>i.fresh).length;return n}

/* ---------- sign-up / login ---------- */
function showLoc(){const e=$('locline');if(!e)return;
 if(locSt==='detecting'){e.innerHTML='Finding your area…';return}
 if(LOC&&LOC.src!=='default')e.innerHTML=`${ic('pin')} Near <b>${esc(locLabel(LOC))}</b><br><button class="chip" onclick="preciseLoc()">${LOC.src==='gps'?'Precise location on ✓':'Use precise location'}</button>`;
 else e.innerHTML=`Couldn’t detect your area automatically. Pick the closest:<select id="lsel" class="ri" aria-label="Closest city" onchange="pickPreset(this.value)">${PRESETS.map((p,i)=>`<option value="${i}" ${LOC&&LOC.city===p.city?'selected':''}>${esc(p.city)}, ${esc(p.region)}</option>`).join('')}</select><button class="chip" style="margin-top:8px" onclick="preciseLoc()">Or use precise location</button>`}
function detectLoc(){if(locP)return locP;locSt='detecting';showLoc();
 locP=ipLoc().then(l=>{LOC=l||{...PRESETS[0],src:'default'};locSt=l?'ok':'failed';showLoc();return LOC});return locP}
function pickPreset(i){LOC={...PRESETS[+i],src:'manual'};locSt='ok';if(!me)showLoc()}
function preciseLoc(){const e=$('locline');if(e)e.innerHTML='Waiting for your browser’s permission…';
 gpsLoc().then(l=>{LOC=l;locSt='ok';if(me){dbSet(`users/${me.id}/loc`,l);rebuild();draw();toast('Location updated')}else showLoc()})
 .catch(()=>{if(me)toast('Couldn’t get precise location. Check your browser’s permission.');else showLoc()})}
function onboard(){return `<div style="min-height:100%;display:flex;flex-direction:column;justify-content:center"><h1 style="font-size:38px;text-align:center">ShelfShare</h1><p class="tag-l" style="font-size:15px;text-align:center;margin-bottom:18px">One Shared Shelf</p>
 <div class="pair big" style="justify-content:center;margin-bottom:18px">${POOL.slice(0,3).map(b=>cv(b)).join('')}</div>
 <label class="lbl" for="un" style="margin-top:0">What should neighbors call you?</label><input id="un" class="ri" style="width:100%;border-radius:14px;padding:12px" maxlength="20" placeholder="e.g. Alex" autocomplete="off" onkeydown="if(event.key==='Enter')signUp()">
 <label class="lbl" for="ut">Your building or neighborhood <span style="font-weight:400;color:var(--mut)">(optional)</span></label><input id="ut" class="ri" style="width:100%;border-radius:14px;padding:12px" maxlength="30" placeholder="e.g. Maple Court Apartments" autocomplete="off" onkeydown="if(event.key==='Enter')signUp()">
 <p id="locline" class="loc"></p>
 <button class="btn acc" onclick="signUp()">Create account</button>
 <p style="color:var(--mut);font-size:13px;margin-top:12px;text-align:center">We’ll put three classics on your shelf so neighbors have something to borrow right away. Already signed up? Enter the same name to log back in.</p>
 <p class="tag" style="margin:10px auto 0;text-align:center">${LIVE?'Live: everyone on this site shares one neighborhood':'Local mode: accounts live in this browser only'}</p>
 <p class="loc" style="font-size:12px">We use your connection to find your approximate area. Neighbors only see roughly where you are (rounded to under a mile), never your address.</p></div>`}
async function afterLogin(){ls.set('ss_me',JSON.stringify(me));rebuild();
 if(!myLoc()){const l=LOC||await detectLoc();dbSet(`users/${me.id}/loc`,l)}
 rebuild();ensureClubs();
 let ts=[];try{ts=JSON.parse(ls.get('ss_ts_'+me.id)||'[]')}catch(e){}tseen=new Set(ts);tnote=new Set(tItems().map(i=>i.key));seen=null;upd=0;notify()}
async function signUp(){await sync(true);if(!DBok){toast('Can’t reach the server. Check your connection.');return}
 const cl=s=>s.replace(/[^\p{L}\p{N} .'’-]/gu,'').trim().slice(0,30),name=cl($('un').value).slice(0,20),unit=cl($('ut').value);if(!name){toast('Enter a name first');return}
 let id=slug(name)||'neighbor';if(/^\d+$/.test(id))id='u-'+id;const U=DB.users||{};let fresh=false;
 if(U[id])me={id,name:U[id].name,unit:U[id].unit};
 else{fresh=true;
  const loc=await Promise.race([detectLoc(),new Promise(r=>setTimeout(()=>r(LOC||{...PRESETS[0],src:'default'}),6000))]);
  const held={};Object.values(U).forEach(u=>Object.values(u.books||{}).forEach(b=>held[b.t]=(held[b.t]||0)+1));
  const pick=POOL.map((b,i)=>[b,i]).sort((x,y)=>(held[x[0].t]||0)-(held[y[0].t]||0)||x[1]-y[1]).slice(0,3).map(x=>x[0]),t0=Date.now()*10,books={};
  pick.forEach((b,i)=>books['b'+(t0+i)]={id:t0+i,t:b.t,a:b.a,c:b.c,on:1});
  await dbSet('users/'+id,{name,unit,joined:Date.now(),loc:{lat:loc.lat,lon:loc.lon,city:loc.city||'',region:loc.region||'',cc:loc.cc||'',src:loc.src||'ip'},books});me={id,name,unit}}
 tab='d';curClub=null;await afterLogin();draw();toast(fresh?`Welcome, ${name}. Three books are now on your shelf`:`Welcome back, ${name}`)}
function signOut(auto){ls.del('ss_me');me=null;seen=null;tseen=null;tnote=null;tab='d';asec='share';csec='clubs';curClub=null;ropen=null;upd=0;draw();if(auto)toast('Account not found. Please sign up again.')}

/* ---------- sync ---------- */
async function sync(force){if(pend)return;const w0=wver;let d;try{d=scrub(await load());DBok=true}catch(e){return}
 if(pend||wver!==w0)return;
 const j=JSON.stringify(d);if(j===last&&!force)return;last=j;DB=d;if(!me)return;if(!(DB.users||{})[me.id]){signOut(1);return}
 rebuild();notify();
 const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
 if(tab==='u'&&curClub){drawMsgs();tabs();return}
 if(['d','a','p','u'].includes(tab)&&!document.querySelector('.scrim,.scrim2')&&!typing)draw();else tabs()}

/* ---------- shell ---------- */
const TABS=[['d','Discover'],['f','Feed'],['s','Add'],['u','Community'],['a','Activity'],['p','Me']];
function tabs(){if(!me){$('tabs').innerHTML='';return}const b=badge();
 $('tabs').innerHTML=TABS.map(([k,n])=>k==='s'?`<button class="scan" onclick="go('s')"><span>${ic('s')}</span>${n}</button>`:`<button class="${tab===k||(tab==='detail'&&k==='d')||(tab==='post'&&k==='f')?'on':''}" onclick="go('${k}')">${ic(k)}${n}${k==='a'&&b?`<b class="dot">${b}</b>`:''}</button>`).join('')}
const VIEWS={d:discover,detail,f:feed,post:compose,s:scan,u:community,a:activity,p:profile};
function draw(){const s=$('screen');s.className=(me&&tab==='u'&&curClub)?'flush':'';
 if(!me){s.innerHTML=onboard();$('tabs').innerHTML='';showLoc();detectLoc();return}
 s.innerHTML=VIEWS[tab]();tabs();if(tab==='u'&&curClub)afterChat()}
setInterval(()=>{if(!document.hidden)sync()},2500);addEventListener('storage',()=>sync());
(async()=>{$('screen').innerHTML='<p style="color:var(--mut);margin-top:40%;text-align:center">Loading…</p>';await sync(true);let sv=null;try{sv=JSON.parse(ls.get('ss_me')||'null')}catch(e){}
 if(sv&&(DB.users||{})[sv.id]){me=sv;await afterLogin()}draw()})();

</script></body></html>
